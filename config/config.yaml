# 跨市场 QDII 标的（受 strategy.max_cross 限仓约束，溢价风险集中）
cross_market:
  - 513100.SH   # 纳指100
  - 513500.SH   # 标普500
  - 159920.SZ   # 恒生
  - 513180.SH   # 恒生科技
  - 510900.SH   # H股
  - 513050.SH   # 中概互联
  - 513330.SH   # 恒生互联网
  - 513000.SH   # 日经225

# 风险分组：同主题/同海外区域最多选一只，避免“8只等权”伪分散。
risk:
  max_per_theme: 2
  max_per_region: 1
  # 组合内相关性去重：候选与已入选标的的250日日收益相关 >= 阈值时视为重复仓位，
  # 跳过并由下一名补位（如科创50 vs 半导体 r=0.97）。回测2018起：夏普0.53→0.57，年化+0.5pp
  max_pairwise_corr: 0.85
  premium_block: 0.05       # QDII 溢价高于此值不新开仓，改由下一名补位
  block_qdii_without_nav: true
  theme_by_code:
    588000.SH: tech
    512480.SH: tech
    515070.SH: tech
    512720.SH: tech
    159915.SZ: tech
    513100.SH: tech
    513500.SH: tech
    513180.SH: tech
    513330.SH: tech
  region_by_code:
    513100.SH: us
    513500.SH: us
    159920.SZ: hongkong
    513180.SH: hongkong
    510900.SH: hongkong
    513050.SH: hongkong
    513330.SH: hongkong
    513000.SH: japan

# 候选池版本：2026-08 新增资产在此之前不可进入回测，避免事后入池偏差。
candidate_activation:
  159930.SZ: "20260801"
  515210.SH: "20260801"
  511380.SH: "20260801"
  511360.SH: "20260801"
  159985.SZ: "20260801"
  159980.SZ: "20260801"

strategy:
  momentum_window: 250       # 12个月动量
  momentum_lag: 0            # 0=纯12月动量（12-1会规避短期反转，但对QDII更差）
  top_n: 8                   # 持有数量
  require_positive: true     # 动量需为正才买入，全负则空仓
  max_momentum: 0.8          # 过热剔除：12月动量超过80%的票不买（防高位接盘）
  max_cross: 2               # 跨市场（cross_market）最多入选数量，限 QDII 溢价/单一市场集中风险；设 null=不限
  rebalance_weekday: 4       # 周五收盘后出信号（0=周一 ... 4=周五，仅非 month_end 模式生效）
  rebalance_schedule: month_end  # month_end=每月最后一个交易日；或用 rebalance_interval_weeks 自定义频率
  rebalance_interval_weeks: 4  # rebalance_schedule 非 month_end 时的调仓间隔（周）
  regime_code: ""              # 大盘趋势过滤（如 510300.SH，其动量转负则整体空仓；空=关闭）

costs:
  commission_rate: 0.00025   # 佣金万 2.5
  min_commission: 5.0        # 最低佣金（元）
  slippage: 0.001            # 滑点 0.1%
  stamp_duty: 0.0            # ETF 免印花税

backtest:
  start: "20180101"
  end: "20261231"

notify:
  channel: dingtalk         # dingtalk / serverchan / pushplus（密钥从 config/.env 环境变量读取）
